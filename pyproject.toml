[project]
name = "study-copilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Forouzan Rezaei", email = "your-github-email@example.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "duckduckgo-search>=8.1.1",
    "fastembed>=0.9.1",
    "google-genai>=3.5.0",
    "langchain-text-splitters>=1.1.3",
    "pymupdf>=2.1",
    "pypdf>=7.1.0",
    "streamlit>=1.67.0",
]

[project.scripts]
study-copilot = "study_copilot:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
